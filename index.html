<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>물만난 예원</title>
  <style>
    /* 기본 리셋 및 전체 핑크 배경 테마 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #ffc2d1 0%, #ffe5ec 50%, #ffb3c6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 상단 헤더 & 점수판 UI */
    header {
      margin-top: 25px;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 2.8rem;
      color: #fb6f92;
      text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 117, 143, 0.4);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .scoreboard {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(251, 111, 146, 0.2);
      font-size: 1.2rem;
      font-weight: 700;
      color: #ff5d8f;
      display: inline-block;
    }

    /* 게임 플레이 영역 */
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 사진 캐릭터 스타일 */
    #character {
      position: absolute;
      width: 110px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    #character:hover {
      transform: scale(1.1);
    }

    /* 누끼 사진이 돋보이도록 부드러운 핑크 그림자 효과 추가 */
    .char-img {
      width: 100px;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 12px rgba(255, 105, 135, 0.4));
      pointer-events: none;
    }

    /* 캐릭터 아래 이름표 태그 */
    .name-tag {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      background: #ff5d8f;
      padding: 3px 12px;
      border-radius: 14px;
      box-shadow: 0 3px 8px rgba(255, 93, 143, 0.4);
      margin-top: -6px;
      pointer-events: none;
    }

    /* 잡았을 때 시각적 피드백 */
    .catch-effect {
      position: absolute;
      font-size: 1.5rem;
      font-weight: 900;
      color: #ff0054;
      background: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(255, 0, 84, 0.3);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: popAndFade 0.7s forwards ease-out;
      z-index: 20;
    }

    @keyframes popAndFade {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.6);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -40px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -70px) scale(1);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>물만난 예원</h1>
    <div class="scoreboard">잡은 횟수: <span id="score">0</span></div>
  </header>

  <div id="game-container">
    <!-- 보내주신 예원님의 사진이 들어가는 영역 -->
    <div id="character">
      <img src="yewon.png" alt="예원" class="char-img">
      <span class="name-tag">예원</span>
    </div>
  </div>

  <script>
    const character = document.getElementById('character');
    const container = document.getElementById('game-container');
    const scoreDisplay = document.getElementById('score');

    let score = 0;
    const charWidth = 110;
    const charHeight = 150; // 사진 비율에 맞춘 높이

    // 위치 변수 초기화
    let posX = Math.random() * (window.innerWidth - charWidth);
    let posY = 150 + Math.random() * (window.innerHeight - charHeight - 150);

    // 속도 설정
    let speed = 3.5;
    let angle = Math.random() * Math.PI * 2;
    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed;

    // 움직임 및 벽 튕김 로직
    function updateMovement() {
      const maxX = window.innerWidth - charWidth;
      const maxY = window.innerHeight - charHeight;
      const minY = 100; // 헤더 보호

      posX += vx;
      posY += vy;

      // 좌우 충돌
      if (posX <= 0) {
        posX = 0;
        vx = -vx;
      } else if (posX >= maxX) {
        posX = maxX;
        vx = -vx;
      }

      // 상하 충돌
      if (posY <= minY) {
        posY = minY;
        vy = -vy;
      } else if (posY >= maxY) {
        posY = maxY;
        vy = -vy;
      }

      character.style.left = `${posX}px`;
      character.style.top = `${posY}px`;

      requestAnimationFrame(updateMovement);
    }

    // '잡았다!' 팝업 생성
    function showCatchEffect(x, y) {
      const effect = document.createElement('div');
      effect.classList.add('catch-effect');
      effect.innerText = '잡았다! 💖';
      effect.style.left = `${x}px`;
      effect.style.top = `${y}px`;

      document.body.appendChild(effect);

      setTimeout(() => {
        effect.remove();
      }, 700);
    }

    // 캐릭터 잡기 클릭 이벤트
    function catchCharacter(e) {
      score += 1;
      scoreDisplay.innerText = score;

      showCatchEffect(posX + charWidth / 2, posY);

      // 새로운 위치로 순간이동 후 방향 전환
      const maxX = window.innerWidth - charWidth;
      const maxY = window.innerHeight - charHeight;
      const minY = 100;

      posX = Math.random() * maxX;
      posY = minY + Math.random() * (maxY - minY);

      angle = Math.random() * Math.PI * 2;
      const currentSpeed = speed + Math.min(score * 0.15, 4); // 점수가 올라갈수록 살짝 빨라짐
      vx = Math.cos(angle) * currentSpeed;
      vy = Math.sin(angle) * currentSpeed;
    }

    character.addEventListener('mousedown', catchCharacter);

    // 창 크기 조절 대응
    window.addEventListener('resize', () => {
      const maxX = window.innerWidth - charWidth;
      const maxY = window.innerHeight - charHeight;
      posX = Math.min(Math.max(0, posX), maxX);
      posY = Math.min(Math.max(100, posY), maxY);
    });

    // 게임 시작
    requestAnimationFrame(updateMovement);
  </script>
</body>
</html>
