<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물만난 예원 - 하드모드</title>
    <style>
        /* 기본 리셋 및 전체 핑크 배경 테마 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffc2d1 0%, #ffe5ec 50%, #ffb3c6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 상단 헤더 & 점수판 UI */
        header {
            margin-top: 25px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2.8rem;
            color: #fb6f92;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 117, 143, 0.4);
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .scoreboard {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(251, 111, 146, 0.25);
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff5d8f;
            display: inline-block;
        }

        #score {
            color: #ff0054;
            font-size: 1.5rem;
        }

        /* 게임 플레이 영역 */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 사진 캐릭터 스타일 */
        #character {
            position: absolute;
            width: 110px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        #character:hover {
            transform: scale(1.1);
        }

        /* 사진 360도 무한 회전 및 입체 그림자 효과 */
        .char-img {
            width: 100px;
            height: auto;
            display: block;
            border-radius: 0;
            border: none;
            background: transparent;
            filter: drop-shadow(0 8px 12px rgba(255, 105, 135, 0.4));
            pointer-events: none;
            animation: spin360 3s linear infinite; /* 360도 회전 애니메이션 적용 완료! */
        }

        @keyframes spin360 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 캐릭터 아래 이름표 태그 */
        .name-tag {
            font-size: 0.9rem;
            font-weight: 800;
            color: #ffffff;
            background: #ff5d8f;
            padding: 3px 12px;
            border-radius: 14px;
            box-shadow: 0 3px 8px rgba(255, 93, 143, 0.4);
            margin-top: 4px;
            pointer-events: none;
        }

        /* 잡았을 때 시각적 피드백 */
        .catch-effect {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ff0054;
            background: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(255, 0, 84, 0.3);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: popAndFade 0.7s forwards ease-out;
            z-index: 20;
        }

        @keyframes popAndFade {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -40px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -70px) scale(1);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>물만난 예원</h1>
        <div class="scoreboard">잡은 횟수: <span id="score">0</span> 점</div>
    </header>

    <div id="game-container">
        <div id="character" onclick="catchCharacter()">
            <img src="yewon.png" alt="예원" class="char-img">
            <span class="name-tag">예원</span>
        </div>
    </div>

    <script>
        const character = document.getElementById('character');
        const scoreDisplay = document.getElementById('score');

        let score = 0;
        const charSize = 110;

        let posX = Math.random() * (window.innerWidth - charSize);
        let posY = 150 + Math.random() * (window.innerHeight - charSize - 150);

        let speed = 4.5;
        let angle = Math.random() * Math.PI * 2;
        let vx = Math.cos(angle) * speed;
        let vy = Math.sin(angle) * speed;

        function updateMovement() {
            const maxX = window.innerWidth - charSize;
            const maxY = window.innerHeight - charSize;
            const minY = 100;

            angle += (Math.random() - 0.5) * 0.15;
            let currentSpeed = Math.sqrt(vx * vx + vy * vy);
            vx = Math.cos(angle) * currentSpeed;
            vy = Math.sin(angle) * currentSpeed;

            posX += vx;
            posY += vy;

            if (posX <= 0) {
                posX = 0;
                vx = -vx;
                angle = Math.PI - angle;
            } else if (posX >= maxX) {
                posX = maxX;
                vx = -vx;
                angle = Math.PI - angle;
            }

            if (posY <= minY) {
                posY = minY;
                vy = -vy;
                angle = -angle;
            } else if (posY >= maxY) {
                posY = maxY;
                vy = -vy;
                angle = -angle;
            }

            character.style.left = `${posX}px`;
            character.style.top = `${posY}px`;

            requestAnimationFrame(updateMovement);
        }

        function showCatchEffect(x, y) {
            const effect = document.createElement('div');
            effect.classList.add('catch-effect');
            effect.innerText = '잡았다! 💖';
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;

            document.body.appendChild(effect);

            setTimeout(() => {
                effect.remove();
            }, 700);
        }

        function catchCharacter(e) {
            score += 1;
            scoreDisplay.innerText = score;

            showCatchEffect(posX + charSize / 2, posY);

            speed += 0.7;

            const maxX = window.innerWidth - charSize;
            const maxY = window.innerHeight - charSize;
            const minY = 100;

            posX = Math.random() * maxX;
            posY = minY + Math.random() * (maxY - minY);

            angle = Math.random() * Math.PI * 2;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed;
        }

        window.addEventListener('resize', () => {
            const maxX = window.innerWidth - charSize;
            const maxY = window.innerHeight - charSize;
            posX = Math.min(Math.max(0, posX), maxX);
            posY = Math.min(Math.max(100, posY), maxY);
        });

        requestAnimationFrame(updateMovement);
    </script>
</body>
</html>
